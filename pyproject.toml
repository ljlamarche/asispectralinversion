[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asispectralinversion"
version = "0.0.1"
authors = [
  { name="Alexander Mule", email="alexander.mule.gr@Dartmouth.edu" },
]
description = "Invert all-sky imagery to precipitation spectrum"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: GPLv3",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "matplotlib",
    "pandas",
    "pillow",
    "beautifulsoup4",
    "scikit-image",
    "skyfield",
    "requests",
    "wget",
    "apexpy",
    "astropy",
    "imageio",
    "pymap3d",
    "tifffile",
    "PyWavelets",
    "tomli; python_version < '3.11'"
]

[project.optional-dependencies]
gneiss = [
    "ipykernel",
    "nbclient",
    "nbformat",
]
dev = [
    "pytest",
]

[project.scripts]
asispectral-config = "asispectralinversion.cli:config_main"
gneiss-run = "asispectralinversion.cli:gneiss_main"
asispectral-download-example = "asispectralinversion.example_data:download_main"
asispectral-glow-inputs = "asispectralinversion.glow:glow_input_main"

[project.urls]
Homepage = "https://github.com/317Lab/asispectralinversion"
Issues = "https://github.com/317Lab/asispectralinversion/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asispectralinversion = ["skymap.mat"]
